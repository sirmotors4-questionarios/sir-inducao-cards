<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIR Motors — Plataforma de Indução</title><meta name="description" content="Portal de Indução SIR Motors — navegação institucional"><style>
:root{--red:#c92330;--dark:#20252d;--muted:#69727e;--line:#e9ebef;--bg:#f6f7f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font:15px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.shell{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:27px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:0 12px 24px;display:flex;gap:11px;align-items:center;font-weight:800;letter-spacing:-.03em;font-size:20px}.brandmark{display:grid;place-items:center;background:var(--red);color:#fff;border-radius:11px;width:37px;height:37px;font-size:15px}.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:650;text-transform:uppercase}.side nav{display:grid;gap:5px}.navlink{padding:12px 14px;border-radius:10px;color:#515b66;font-weight:600;display:flex;align-items:center;gap:12px}.navlink:hover,.navlink[aria-current=page]{background:#faebed;color:#a91c28}.sidefoot{padding:25px 13px 0;color:#9299a3;font-size:11px}.main{min-width:0}.top{background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:18px clamp(22px,4vw,64px);gap:20px}.top b{font-size:13px}.search{width:min(360px,52%);padding:11px 14px;border:1px solid #e4e7eb;border-radius:10px;background:#f9fafb;color:#222;outline-color:var(--red)}.inner{max-width:1200px;margin:auto;padding:34px clamp(22px,4vw,64px) 70px}.hero{background:linear-gradient(115deg,#9e1727,#d52c3a);border-radius:18px;padding:clamp(28px,5vw,55px);color:white;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-60px;top:-90px;width:350px;height:350px;border:1px solid #ffffff44;border-radius:50%;box-shadow:0 0 0 56px #ffffff09,0 0 0 115px #ffffff08;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:800;opacity:.85}.hero h1{font-size:clamp(29px,4vw,46px);line-height:1.12;letter-spacing:-.04em;margin:12px 0}.hero p{max-width:690px;color:#fff;opacity:.86;margin:0;font-size:15px;line-height:1.7}.secHead{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:32px 0 17px}.secHead h2{font-size:23px;letter-spacing:-.03em;margin:0}.secHead p{color:var(--muted);font-size:13px;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{border:1px solid var(--line);background:#fff;min-height:155px;border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;transition:background .23s,border-color .23s,transform .23s,box-shadow .23s;cursor:pointer}.card svg{color:var(--red)}.ico{width:38px;height:38px;border-radius:10px;background:#f9e8eb;color:var(--red);display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:16px}.card strong{display:block;line-height:1.3;font-size:16px}.card p{font-size:12px;color:var(--muted);margin:8px 0 0}.card:focus-visible,.navlink:focus-visible{outline:3px solid var(--red);outline-offset:2px}.tag{font-size:10px;color:#ac4854;font-weight:700;letter-spacing:.04em;margin-top:14px}.back{border:0;background:none;color:var(--red);font-weight:700;padding:0;cursor:pointer;margin:0 0 25px}.notice{margin-top:24px;padding:18px 22px;background:#fff;border:1px solid #eee2c8;border-radius:12px;color:#705a35;font-size:13px}.pagelead{background:#fff;border:1px solid var(--line);border-radius:15px;padding:26px}.pagelead h2{margin:0 0 9px;font-size:23px}.pagelead p{color:var(--muted);margin:0 0 14px}.orig{display:inline-flex;padding:10px 15px;border:1px solid #e2e5e9;border-radius:8px;font-weight:700;font-size:12px}.orig:hover{background:#faeaec;border-color:#e9b6bc}.crumb{color:var(--muted);font-size:12px;margin-bottom:13px}.empty{color:var(--muted);padding:30px;background:white;border-radius:12px}.mobilemenu{display:none}@media(hover:hover) and (pointer:fine){.card:hover{background:#fff2f3;border-color:#efb6be;box-shadow:0 10px 25px #6f172012;transform:translateY(-3px)}}@media(max-width:1080px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:740px){.shell{display:block}.side{height:auto;position:relative;padding:15px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 0 10px}.side nav{display:flex;overflow-x:auto;gap:5px}.navlink{white-space:nowrap;font-size:12px;padding:9px 10px}.sidefoot{display:none}.top{padding:14px 20px}.inner{padding:24px 17px}.grid{gap:12px}.card{padding:17px;min-height:155px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.search{width:57%}.hero{padding:26px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="brandmark">SIR</div><div>Motors<small>Portal de indução</small></div></div><nav id="menu" aria-label="Navegação principal"></nav><div class="sidefoot">Plataforma de Indução · SIR Motors</div></aside><div class="main"><header class="top"><b>Plataforma de Indução <a href="./app.html" style="margin-left:16px;color:#b72230;text-decoration:none">Entrar / Administração ↗</a></b><input class="search" id="search" type="search" placeholder="Pesquisar páginas…" aria-label="Pesquisar páginas"></header><main class="inner" id="view"></main></div></div><script>
const sections=[{"slug":"empresa","label":"A Empresa","icon":"▦","subtitle":"Identidade, história e organização do Grupo SIR","pages":[["Quem Somos","3f240ace18298116b222d669f1dd7a4b","Apresentação da organização"],["História","3f240ace1829818d9153f9d4c16d159a","Marcos históricos do Grupo SIR"],["Missão, Visão e Valores","3f240ace182981119fe2eb4ca0406f84","Princípios institucionais"],["Organograma","3f240ace182981e190bac72cde8b5f58","Estruturas organizacionais"],["Empresas do Grupo","3f240ace18298183a977f9db53469a0b","Empresas e áreas de actividade"],["Liderança","3f240ace18298104a9aceb12191f5f37","Responsáveis pela organização"]]},{"slug":"politicas","label":"Políticas","icon":"▤","subtitle":"Princípios, conduta e normas de trabalho","pages":[["Cultura Organizacional","3f240ace1829814fa489da1bfd7f5278","Como trabalhamos"],["Código de Conduta","3f240ace182981ccbad4e5ef3466525e","Princípios de comportamento"],["Políticas Gerais","3f240ace182981a5b58df2c717d671fd","Orientações gerais"],["Normas de Trabalho","3f240ace182981aba64ec77b68800cfd","Regras do dia a dia"],["Outras Políticas","3f240ace182981a39391c63747205ed6","Outras orientações"]]},{"slug":"inducao","label":"Indução","icon":"✧","subtitle":"Percurso de integração dos colaboradores","pages":[["Percurso de integração","3f240ace1829812dacf5da988c48631a","Seis etapas de integração"],["Indução por departamento","3f240ace1829812dacf5da988c48631a","Materiais da função e equipa"]]},{"slug":"documentos","label":"Manuais & Procedimentos","icon":"▧","subtitle":"Biblioteca de documentação corporativa","pages":[["Manuais","3f240ace182981178256d577e77fe443","Manuais organizacionais"],["SOPs","3f240ace182981318841f4cbb3a912b2","Procedimentos operacionais padrão"],["Formulários","3f240ace18298185a25aca81f7dc0369","Formulários internos"],["Templates","3f240ace182981f98048f458b4c5457f","Modelos e documentos-tipo"],["FAQ","3f240ace18298162b166dfcb7a55cf85","Perguntas frequentes"]]}];
const view=document.getElementById('view'),menu=document.getElementById('menu'),search=document.getElementById('search');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={inicio:'⌂',empresa:'◈',politicas:'▤',inducao:'✦',documentos:'▧'};
function drawMenu(){let current=location.hash.split('/')[1]||'inicio';menu.innerHTML=[['inicio','Início'],...sections.map(s=>[s.slug,s.label])].map(([key,label])=>'<a class="navlink" '+(current===key?'aria-current="page" ':'')+'href="#/'+key+'"><span aria-hidden="true">'+icons[key]+'</span>'+esc(label)+'</a>').join('')}
function card(title,desc,url,icon,note){return '<a class="card" href="'+esc(url)+'"><div><div class="ico" aria-hidden="true">'+esc(icon)+'</div><strong>'+esc(title)+'</strong><p>'+esc(desc)+'</p></div>'+(note?'<div class="tag">'+esc(note)+'</div>':'')+'</a>'}
function show(){drawMenu();let route=decodeURIComponent(location.hash.slice(2)).split('/').filter(Boolean),category=sections.find(s=>s.slug===route[0]);let q=search.value.trim().toLocaleLowerCase('pt');if(q){let results=sections.flatMap(s=>s.pages.map((p,i)=>({s,p,i}))).filter(x=>(x.p[0]+' '+x.p[2]+' '+x.s.label).toLocaleLowerCase('pt').includes(q));view.innerHTML='<div class="secHead"><div><h2>Resultados da pesquisa</h2><p>'+results.length+' página(s) encontrada(s)</p></div></div>'+(results.length?'<div class="grid">'+results.map(({s,p,i})=>card(p[0],p[2],'#/'+s.slug+'/'+i,s.icon,'PÁGINA')).join('')+'</div>':'<div class="empty">Não foram encontradas páginas.</div>');return}
if(!category){view.innerHTML='<section class="hero"><div class="eyebrow">Grupo SIR · Bem-vindo</div><h1>O seu espaço de integração</h1><p>Conheça a empresa, as políticas e os procedimentos através de uma navegação organizada. Os conteúdos internos serão disponibilizados após a implementação do controlo de acesso.</p></section><div class="secHead"><div><h2>Explore a plataforma</h2><p>Seleccione uma área para consultar as respectivas páginas.</p></div></div><div class="grid">'+sections.map(s=>card(s.label,s.subtitle,'#/'+s.slug,icons[s.slug],s.pages.length+' PÁGINAS')).join('')+'</div>';return}
if(route.length===1){view.innerHTML='<div class="crumb">Início / '+esc(category.label)+'</div><section class="hero"><div class="eyebrow">SIR Motors · Plataforma de Indução</div><h1>'+esc(category.label)+'</h1><p>'+esc(category.subtitle)+'</p></section><div class="secHead"><div><h2>Páginas desta secção</h2><p>Escolha o conteúdo que pretende consultar.</p></div></div><div class="grid">'+category.pages.map((p,i)=>card(p[0],p[2],'#/'+category.slug+'/'+i,category.icon,'CONSULTAR')).join('')+'</div>';return}
let idx=Number(route[1]);if(!Number.isInteger(idx)||!category.pages[idx]){location.hash='#/'+category.slug;return}
const page=category.pages[idx];view.innerHTML='<div class="crumb">Início / '+esc(category.label)+' / '+esc(page[0])+'</div><button type="button" class="back" id="back">← Voltar à secção</button><section class="pagelead"><div class="eyebrow" style="color:#ad2330">SIR Motors</div><h2>'+esc(page[0])+'</h2><p>'+esc(page[2])+'</p><p>Esta página já está estruturada no novo portal. A publicação do conteúdo integral fica reservada para a fase de autenticação.</p><a class="orig" href="https://app.notion.com/p/'+esc(page[1])+'" target="_blank" rel="noopener noreferrer">Consultar a página original no Notion ↗</a></section><div class="notice">O novo portal ainda é público no GitHub Pages. Os documentos e conteúdos internos não estão publicados aqui. A restrição de acesso será implementada na etapa seguinte.</div>';document.getElementById('back').addEventListener('click',()=>location.hash='#/'+category.slug);
}
window.addEventListener('hashchange',()=>{search.value='';show();window.scrollTo(0,0)});search.addEventListener('input',show);show();
</script></body></html>
